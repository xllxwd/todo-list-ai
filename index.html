<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待办事项</title>
    <style>
      :root {
        --ink: #27313c;
        --muted: #8e806f;
        --line: rgba(137, 116, 88, 0.28);
        --paper: rgba(255, 252, 245, 0.64);
        --paper-strong: rgba(255, 253, 248, 0.82);
        --brown: #806549;
        --brown-dark: #624e39;
        --rose: #c86f70;
        --rose-dark: #a85355;
        --shadow: 0 22px 70px rgba(60, 48, 34, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        font-family:
          "Songti SC", "Noto Serif SC", "STSong", Georgia, serif;
        background:
          linear-gradient(rgba(255, 253, 247, 0.72), rgba(255, 250, 242, 0.82)),
          repeating-linear-gradient(
            0deg,
            rgba(116, 101, 80, 0.07) 0,
            rgba(116, 101, 80, 0.07) 1px,
            transparent 1px,
            transparent 5px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(116, 101, 80, 0.06) 0,
            rgba(116, 101, 80, 0.06) 1px,
            transparent 1px,
            transparent 5px
          ),
          #ede7da;
        display: grid;
        place-items: start center;
        padding: 30px 18px;
      }

      .app {
        width: min(960px, 100%);
        min-height: calc(100vh - 60px);
        padding: clamp(28px, 5vw, 48px) clamp(18px, 5vw, 56px);
        border: 1px solid rgba(122, 108, 88, 0.26);
        background: var(--paper);
        backdrop-filter: blur(22px) saturate(1.15);
        -webkit-backdrop-filter: blur(22px) saturate(1.15);
        box-shadow: var(--shadow), inset 0 1px rgba(255, 255, 255, 0.8);
      }

      .header {
        display: grid;
        gap: 26px;
        margin-bottom: 34px;
      }

      h1 {
        margin: 0;
        text-align: center;
        font-size: clamp(38px, 6vw, 56px);
        font-weight: 500;
        letter-spacing: 0;
        line-height: 1.1;
      }

      .new-task {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 14px;
        align-items: stretch;
      }

      .new-task input {
        width: 100%;
        min-height: 54px;
        padding: 0 18px;
        border: 2px dashed rgba(128, 101, 73, 0.75);
        border-radius: 0;
        background: rgba(255, 255, 255, 0.42);
        color: var(--ink);
        font: inherit;
        font-size: 18px;
        outline: none;
        transition:
          border-color 160ms ease,
          background 160ms ease,
          box-shadow 160ms ease;
      }

      .new-task input::placeholder {
        color: rgba(128, 101, 73, 0.48);
      }

      .new-task input:focus {
        border-color: var(--brown);
        background: rgba(255, 255, 255, 0.66);
        box-shadow: 0 0 0 4px rgba(128, 101, 73, 0.1);
      }

      button {
        min-height: 44px;
        border: 1px solid rgba(77, 58, 41, 0.34);
        border-radius: 0;
        color: #fffaf0;
        font: inherit;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 3px 7px rgba(55, 43, 31, 0.22);
        transition:
          transform 140ms ease,
          box-shadow 140ms ease,
          background 140ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 5px 12px rgba(55, 43, 31, 0.25);
      }

      button:active {
        transform: translateY(0);
        box-shadow: 0 2px 5px rgba(55, 43, 31, 0.2);
      }

      .add-button {
        width: 92px;
        background: #b5a691;
      }

      .add-button:hover {
        background: #a3947f;
      }

      .tasks {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .task {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        min-height: 78px;
        padding: 14px 26px;
        border: 1px solid var(--line);
        border-left: 3px solid rgba(128, 101, 73, 0.86);
        background: var(--paper-strong);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 5px 14px rgba(68, 54, 38, 0.09);
      }

      .task.subtask {
        width: calc(100% - 64px);
        margin-left: 64px;
      }

      .check {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border: 2px solid rgba(128, 101, 73, 0.78);
        background: rgba(255, 255, 255, 0.45);
        cursor: pointer;
      }

      .check input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .mark {
        width: 14px;
        height: 8px;
        border: solid #fffaf0;
        border-width: 0 0 3px 3px;
        opacity: 0;
        transform: rotate(-45deg) translateY(-1px);
      }

      .check:has(input:checked) {
        background: var(--brown);
        border-color: var(--brown-dark);
      }

      .check:has(input:checked) .mark {
        opacity: 1;
      }

      .title {
        min-width: 0;
        overflow-wrap: anywhere;
        font-size: 19px;
        line-height: 1.45;
      }

      .task:has(input:checked) .title {
        color: rgba(39, 49, 60, 0.52);
        text-decoration: line-through;
        text-decoration-thickness: 1px;
      }

      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .split-button {
        width: 84px;
        background: var(--brown);
      }

      .split-button:hover {
        background: var(--brown-dark);
      }

      .delete-button {
        width: 84px;
        background: var(--rose);
        border-color: rgba(130, 47, 49, 0.38);
      }

      .delete-button:hover {
        background: var(--rose-dark);
      }

      .empty {
        display: none;
        padding: 38px 18px;
        border: 1px dashed rgba(128, 101, 73, 0.4);
        background: rgba(255, 255, 255, 0.36);
        text-align: center;
        color: var(--muted);
        font-size: 18px;
      }

      .tasks:empty + .empty {
        display: block;
      }

      @media (max-width: 680px) {
        body {
          padding: 0;
          place-items: stretch;
        }

        .app {
          min-height: 100vh;
          width: 100%;
          padding: 28px 16px;
          border: 0;
        }

        .header {
          gap: 20px;
          margin-bottom: 24px;
        }

        .new-task {
          grid-template-columns: 1fr;
        }

        .add-button {
          width: 100%;
        }

        .task,
        .task.subtask {
          width: 100%;
          margin-left: 0;
        }

        .task {
          grid-template-columns: auto minmax(0, 1fr);
          gap: 12px;
          padding: 15px 14px;
        }

        .actions {
          grid-column: 2;
          justify-content: end;
          width: 100%;
        }

        .split-button,
        .delete-button {
          width: min(92px, 46%);
        }
      }
    </style>
  </head>
  <body>
    <main class="app" aria-labelledby="page-title">
      <header class="header">
        <h1 id="page-title">待办事项</h1>
        <form class="new-task" id="new-task-form">
          <input
            id="new-task-input"
            type="text"
            autocomplete="off"
            placeholder="写下新任务..."
            aria-label="写下新任务"
          />
          <button class="add-button" type="submit">添加</button>
        </form>
      </header>

      <ul class="tasks" id="task-list" aria-label="任务列表"></ul>
      <p class="empty">还没有任务</p>
    </main>

    <script>
      const API_BASE_URL = window.location.protocol === "file:" ? "http://localhost:3000" : "";
      const form = document.querySelector("#new-task-form");
      const input = document.querySelector("#new-task-input");
      const list = document.querySelector("#task-list");

      const apiRequest = async (path, options = {}) => {
        const response = await fetch(`${API_BASE_URL}${path}`, {
          method: options.method || "GET",
          headers: {
            Accept: "application/json",
            ...(options.body ? { "Content-Type": "application/json" } : {}),
          },
          body: options.body ? JSON.stringify(options.body) : undefined,
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.details || data.error || "请求失败");
        }

        return data;
      };

      const createRemoteTask = async (title, parentId = null) => {
        const data = await apiRequest("/api/tasks", {
          method: "POST",
          body: { title, parent_id: parentId },
        });

        return data.task;
      };

      const breakdownRemoteTask = async (id, title) => {
        const data = await apiRequest("/api/tasks/breakdown", {
          method: "POST",
          body: { id, title },
        });

        return data.subtasks || [];
      };

      const createTask = ({ id, title, completed = false, parent_id = null, subtask = false }) => {
        const item = document.createElement("li");
        item.className = subtask || parent_id ? "task subtask" : "task";
        if (id) item.dataset.id = id;
        if (parent_id) item.dataset.parentId = parent_id;

        item.innerHTML = `
          <label class="check">
            <input type="checkbox" />
            <span class="mark" aria-hidden="true"></span>
          </label>
          <span class="title"></span>
          <div class="actions">
            <button class="split-button" type="button">拆解</button>
            <button class="delete-button" type="button">删除</button>
          </div>
        `;

        const checkbox = item.querySelector("input");
        item.querySelector(".title").textContent = title;
        checkbox.checked = completed;
        checkbox.setAttribute("aria-label", `完成 ${title}`);
        checkbox.addEventListener("change", async () => {
          if (!id) return;

          const nextCompleted = checkbox.checked;
          checkbox.disabled = true;

          try {
            await apiRequest(`/api/tasks/${id}`, {
              method: "PATCH",
              body: { completed: nextCompleted },
            });
          } catch (error) {
            checkbox.checked = !nextCompleted;
            alert(error.message);
          } finally {
            checkbox.disabled = false;
          }
        });

        item.querySelector(".delete-button").addEventListener("click", async () => {
          if (!id) {
            item.remove();
            return;
          }

          try {
            await apiRequest(`/api/tasks/${id}`, { method: "DELETE" });
            if (!item.classList.contains("subtask")) {
              let next = item.nextElementSibling;

              while (next && next.classList.contains("subtask")) {
                const current = next;
                next = next.nextElementSibling;
                current.remove();
              }
            }

            item.remove();
          } catch (error) {
            alert(error.message);
          }
        });

        item.querySelector(".split-button").addEventListener("click", async () => {
          if (!id) return;

          const splitButton = item.querySelector(".split-button");
          splitButton.disabled = true;
          splitButton.textContent = "拆解中";

          try {
            let insertAfter = item;
            let next = item.nextElementSibling;

            while (next && next.classList.contains("subtask")) {
              insertAfter = next;
              next = next.nextElementSibling;
            }

            const subtasks = await breakdownRemoteTask(id, title);
            subtasks.forEach((task) => {
              const child = createTask({ ...task, subtask: true });
              insertAfter.insertAdjacentElement("afterend", child);
              insertAfter = child;
            });
          } catch (error) {
            alert(error.message);
          } finally {
            splitButton.disabled = false;
            splitButton.textContent = "拆解";
          }
        });

        return item;
      };

      const loadTasks = async () => {
        try {
          const data = await apiRequest("/api/tasks");
          const tasks = data.tasks || [];
          const subtasksByParent = new Map();
          const topLevelTasks = [];

          tasks.forEach((task) => {
            if (task.parent_id) {
              const children = subtasksByParent.get(task.parent_id) || [];
              children.push(task);
              subtasksByParent.set(task.parent_id, children);
              return;
            }

            topLevelTasks.push(task);
          });

          subtasksByParent.forEach((children) => {
            children.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
          });

          const nodes = [];
          topLevelTasks.forEach((task) => {
            nodes.push(createTask(task));

            const children = subtasksByParent.get(task.id) || [];
            children.forEach((child) => nodes.push(createTask({ ...child, subtask: true })));
          });

          list.replaceChildren(...nodes);
        } catch (error) {
          alert(`加载任务失败：${error.message}`);
        }
      };

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const title = input.value.trim();
        if (!title) return;

        const button = form.querySelector(".add-button");
        button.disabled = true;

        try {
          const task = await createRemoteTask(title);
          list.prepend(createTask(task));
          input.value = "";
          input.focus();
        } catch (error) {
          alert(error.message);
        } finally {
          button.disabled = false;
        }
      });

      loadTasks();
    </script>
  </body>
</html>
